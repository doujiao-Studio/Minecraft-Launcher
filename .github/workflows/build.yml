name: Build NCL Launcher (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 允许推送 tag 时自动创建/更新 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      # 源码位于仓库的 MC启动器/ 子目录，构建需先切进去
      - name: Build single-file exe
        working-directory: MC启动器
        run: pyinstaller MCL-Launcher.spec --noconfirm

      - name: Package release zip
        working-directory: MC启动器/dist
        run: |
          powershell -Command "Compress-Archive -Path NCL.exe -DestinationPath ../NCL-免安装版.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCL-免安装版
          path: MC启动器/NCL-免安装版.zip

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MC启动器/NCL-免安装版.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
